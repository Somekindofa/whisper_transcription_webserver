# Sample workflow — deploys to a remote host via SSH and runs the repo deploy script.
# NOTE: this only works if GitHub Actions can reach your server via SSH OR you run this on a self-hosted runner.
# Secrets required: SSH_HOST, SSH_USER, SSH_PORT (optional), SSH_PRIVATE_KEY

name: Deploy to server
on:
  push:
    branches: [ master, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy (SSH)
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            cd 'C:\Users\dupon\Documents\Personal\whisper_transcriptor'
            git fetch --all
            git reset --hard origin/${{ github.ref == 'refs/heads/main' && 'main' || 'master' }}
            powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\deploy_and_restart.ps1 -Branch ${{ github.ref == 'refs/heads/main' && 'main' || 'master' }}
